services:
  mysql:
    container_name: home
    build:
      context: .
      dockerfile: Dockerfile-mysql
    ports:
      - "13306:3306"  # 修改为 13306 或其他未使用的端口
    networks:
      - app-network
    volumes:
      - mysql_data:/var/lib/mysql  # 持久化数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "xiaozhi", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node:
    build:
      container_name: node
      context: .
      dockerfile: Dockerfile-node
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - app-network
    environment:
      - API_URL=http://server:8091

  server:
    build:
      container_name: server
      context: .
      dockerfile: Dockerfile-server
      args:
        - VOSK_MODEL_SIZE=${VOSK_MODEL_SIZE:-standard}
      # 添加构建缓存设置
      cache_from:
        - eclipse-temurin:21-jre
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8091:8091"
      - "1883:1883"
      - "20000-21000:20000-21000/udp"
    networks:
      - app-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xiaozhi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=xiaozhi
      - SPRING_DATASOURCE_PASSWORD=123456
      - xiaozhi.firmware.version=2.1.2
      - XIAOZHI_SSL_SKIP_VERIFICATION=false
      - XIAOZHI_MQTT_EXTERNAL_HOST=8.130.214.215
      - HOST_IP=8.130.214.215   # ← 这里添加
    volumes:
      - maven_repo:/root/.m2/repository  # 持久化Maven仓库
      - vosk_models:/vosk_cache  # 持久化Vosk模型
    restart: on-failure  # 添加重启策略，如果启动失败会自动重试

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/data/mysql

  maven_repo:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/data/maven

  vosk_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/data/vosk

  app_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/data/appfile

